name: Docker deploy

# Deploys to a self-hosted runner. Built for machines behind NAT: the runner
# polls GitHub outbound, so the host needs no inbound ports and no SSH.
#
# The image is built on the target rather than pulled from a registry. At
# small scale that avoids registry auth and architecture mismatches entirely.

on:
  workflow_call:
    inputs:
      deploy-dir:
        description: Absolute path to the checkout on the runner host.
        type: string
        required: true
      health-url:
        type: string
        default: http://127.0.0.1:8000/health
      health-timeout:
        description: Seconds to wait for the service to report healthy.
        type: number
        default: 30
      compose-file:
        type: string
        default: docker-compose.yml
      runner-labels:
        description: JSON array of runner labels, e.g. '["self-hosted","Linux"]'
        type: string
        default: '["self-hosted","Linux"]'
      prune-images:
        type: boolean
        default: true
      smoke-command:
        description: Optional shell command run after the health gate. Non-zero fails the deploy.
        type: string
        default: ""
    secrets:
      TELEGRAM_BOT_TOKEN:
        description: Telegram bot token from @BotFather. Optional; no notification is sent when absent.
        required: false
      TELEGRAM_CHAT_ID:
        description: Chat or group ID the bot should post to.
        required: false

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runner-labels) }}

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    # Two deploys must never interleave on one machine.
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Record current revision
        id: before
        run: |
          cd "${{ inputs.deploy-dir }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pull latest code
        run: |
          cd "${{ inputs.deploy-dir }}"
          git fetch --prune origin "${GITHUB_REF_NAME}"
          # Hard reset rather than merge: the host must match the repo exactly,
          # and a half-merged deploy is worse than a failed one.
          # NOTE: this discards uncommitted changes in the deploy directory.
          git reset --hard "origin/${GITHUB_REF_NAME}"
          echo "now at $(git rev-parse --short HEAD)"

      - name: Rebuild and restart
        run: |
          cd "${{ inputs.deploy-dir }}"
          docker compose -f "${{ inputs.compose-file }}" up -d --build

      - name: Wait for healthy
        id: health
        run: |
          for i in $(seq 1 ${{ inputs.health-timeout }}); do
            if curl -fsS "${{ inputs.health-url }}" > /dev/null 2>&1; then
              echo "healthy after ${i}s"
              curl -s "${{ inputs.health-url }}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::not healthy within ${{ inputs.health-timeout }}s"
          exit 1

      - name: Smoke test
        if: inputs.smoke-command != ''
        run: |
          cd "${{ inputs.deploy-dir }}"
          ${{ inputs.smoke-command }}

      - name: Roll back
        id: rollback
        if: failure() && steps.before.outputs.sha != ''
        run: |
          cd "${{ inputs.deploy-dir }}"
          echo "::warning::deploy failed, rolling back to ${{ steps.before.outputs.sha }}"
          git reset --hard "${{ steps.before.outputs.sha }}"
          docker compose -f "${{ inputs.compose-file }}" up -d --build
          docker compose -f "${{ inputs.compose-file }}" logs --tail 50

      - name: Clean up old images
        if: success() && inputs.prune-images
        run: docker image prune -f

      # Last step, always runs. Skipped when no bot token is configured, and it
      # can never fail the deploy: a Telegram outage must not turn a good deploy red.
      - name: Notify Telegram
        if: always() && env.TELEGRAM_BOT_TOKEN != ''
        continue-on-error: true
        env:
          STATUS: ${{ job.status }}
          ROLLED_BACK: ${{ steps.rollback.outcome == 'success' }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Build the request in Python so a commit message can never break or
          # inject into it. python3 ships with Ubuntu; jq may not.
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          e = os.environ
          name = e["REPO"].split("/")[-1]
          short = e["SHA"][:7]
          lines = (e.get("COMMIT_MSG") or "").splitlines()
          subject = lines[0] if lines else ""
          # Telegram MarkdownV2 requires these characters to be escaped.
          def esc(s):
              for c in r"_*[]()~`>#+-=|{}.!":
                  s = s.replace(c, "\\" + c)
              return s

          if e["STATUS"] == "success":
              head = f"✅ *{esc(name)}* deployed `{short}`"
          elif e["STATUS"] == "cancelled":
              head = f"⚠️ *{esc(name)}* deploy of `{short}` was cancelled"
          elif e["ROLLED_BACK"] == "true":
              head = f"❌ *{esc(name)}* deploy of `{short}` failed and was rolled back"
          else:
              head = f"❌ *{esc(name)}* deploy of `{short}` failed"

          detail = f"{esc(subject)} \\- by {esc(e['ACTOR'])} \\- [view run]({e['RUN_URL']})"
          text = f"{head}\n{detail}"

          body = urllib.parse.urlencode({
              "chat_id": e["TELEGRAM_CHAT_ID"],
              "text": text,
              "parse_mode": "MarkdownV2",
              "disable_web_page_preview": "true",
          }).encode()

          url = f"https://api.telegram.org/bot{e['TELEGRAM_BOT_TOKEN']}/sendMessage"
          request = urllib.request.Request(url, body)
          urllib.request.urlopen(request, timeout=10).read()
          PY
